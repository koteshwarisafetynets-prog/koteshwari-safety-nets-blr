  <line x1="33" y1="52" x2="68" y2="28" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" />
  <line x1="45" y1="44" x2="70" y2="76" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" />

  <!-- Saffron Tension Point Dot -->
